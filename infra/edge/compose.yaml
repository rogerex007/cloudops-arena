# Standalone restricted preview; do not combine with infra/local/compose.yaml.
name: cloudops-arena-edge
services:
  storage:
    image: ${FLOCI_IMAGE:-floci/floci:latest}
    environment:
      FLOCI_DEFAULT_REGION: us-east-1
      FLOCI_DEFAULT_ACCOUNT_ID: "000000000001"
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
    volumes:
      - arena-data:/app/data
    networks: [backend]
    restart: unless-stopped

  init-storage:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    command: ["python", "scripts/init_floci.py"]
    environment:
      DYNAMODB_ENDPOINT_URL: http://storage:4566
      DYNAMODB_TABLE_NAME: CloudOpsArena
      AWS_DEFAULT_REGION: us-east-1
    depends_on: [storage]
    networks: [backend]
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      ENVIRONMENT: preview
      EVALUATION_QUEUE_WAIT_SECONDS: ${EVALUATION_QUEUE_WAIT_SECONDS:-1800}
      EVALUATION_QUEUE_LIMIT: ${EVALUATION_QUEUE_LIMIT:-50}
      EVALUATION_CONCURRENCY: ${EVALUATION_CONCURRENCY:-2}
      DEMO_MODE: "false"
      JWT_SECRET: ${JWT_SECRET:?Run scripts/setup-edge.sh first}
      JWT_EXP_MINUTES: "60"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-instructor}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run scripts/setup-edge.sh first}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?Run scripts/setup-edge.sh first}
      GITHUB_LEGACY_SCORING_ENABLED: "false"
      GITHUB_APP_CONFIG_FILE: /run/secrets/github_app_config
      GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/github_app_key
      PUBLIC_BASE_URL: https://arena.costacorp.net
      ACTIONS_OIDC_AUDIENCE: ${ACTIONS_OIDC_AUDIENCE:-https://arena.costacorp.net}
      EVALUATION_RUNNER_TOKEN_FILE: /run/secrets/runner_token
      DYNAMODB_ENDPOINT_URL: http://storage:4566
      DYNAMODB_REGION: us-east-1
      DYNAMODB_TABLE_NAME: CloudOpsArena
      GAME_PACKS_DIR: /app/game-packs
      CORS_ORIGINS: https://arena.costacorp.net
    depends_on:
      init-storage:
        condition: service_completed_successfully
    networks: [frontend, backend]
    secrets: [github_app_config, github_app_key, runner_token]
    restart: unless-stopped

  web:
    build:
      context: ../../apps/web
    ports:
      - "127.0.0.1:5174:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
    networks: [frontend]
    restart: unless-stopped

  worker:
    stop_grace_period: 10m
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    environment:
      EVALUATION_QUEUE_WAIT_SECONDS: ${EVALUATION_QUEUE_WAIT_SECONDS:-1800}
      DYNAMODB_ENDPOINT_URL: http://storage:4566
      DYNAMODB_REGION: us-east-1
      DYNAMODB_TABLE_NAME: CloudOpsArena
      GAME_PACKS_DIR: /app/game-packs
      EVALUATION_RUNNER_TOKEN_FILE: /run/secrets/runner_token
    depends_on:
      init-storage:
        condition: service_completed_successfully
    networks: [backend, worker-egress]
    secrets: [runner_token]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    restart: unless-stopped

  tunnel:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    profiles: [tunnel]
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/run/secrets/tunnel_token"]
    secrets: [tunnel_token]
    depends_on: [web]
    networks: [frontend]
    restart: unless-stopped

networks:
  frontend:
  worker-egress:
  backend:
    internal: true

volumes:
  arena-data:

secrets:
  github_app_config:
    file: ./.secrets/github-app.json
  github_app_key:
    file: ./.secrets/github-app.pem
  runner_token:
    file: ./.secrets/runner-token
  tunnel_token:
    file: ./.secrets/cloudflare-tunnel-token
