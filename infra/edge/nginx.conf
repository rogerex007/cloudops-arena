# CF-Connecting-IP is supplied by Cloudflare. The only published host port
# binds to loopback; do not expose this origin directly to the LAN/Internet.
map $http_cf_connecting_ip $arena_client_ip {
  "" $remote_addr;
  default $http_cf_connecting_ip;
}
map $http_x_forwarded_proto $arena_proto {
  default $scheme;
  https https;
}
limit_req_zone $arena_client_ip zone=arena_instructor:10m rate=5r/m;
limit_req_zone $arena_client_ip zone=arena_auth:10m rate=30r/m;
limit_req_zone $arena_client_ip zone=arena_api:10m rate=40r/s;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;
  limit_req_status 429;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;

  location = /api/v1/admin/demo/award { return 404; }
  location ^~ /internal/ { return 404; }
  # OAuth codes/states must not appear in origin access logs.
  location = /api/v1/github/callback {
    access_log off;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $arena_proto;
  }

  # Keep instructor password attempts separate from the university signup burst.
  location ^~ /api/v1/auth/admin/ {
    limit_req zone=arena_instructor burst=5 nodelay;
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $arena_client_ip;
    proxy_set_header X-Forwarded-For $arena_client_ip;
    proxy_set_header X-Forwarded-Proto $arena_proto;
  }

  location /api/ {
    limit_req zone=arena_api burst=150 nodelay;
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $arena_client_ip;
    proxy_set_header X-Forwarded-For $arena_client_ip;
    proxy_set_header X-Forwarded-Proto $arena_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    location ~ ^/api/v1/auth/ {
      limit_req zone=arena_auth burst=60 nodelay;
      proxy_pass http://api:8000;
    }
  }

  location = /health {
    proxy_pass http://api:8000/health;
    access_log off;
  }

  # Dedicated entry path: Cloudflare Access protects this path and its children.
  # Client routing is not an authorization boundary; admin APIs still check JWT roles.
  location = /instructor {
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    try_files /index.html =404;
  }
  location ^~ /instructor/ {
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    try_files /index.html =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
